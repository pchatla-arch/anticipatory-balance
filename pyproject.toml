[project]
name = "foresight"
version = "0.0.1"
description = "Foresight: belief-based anticipation of external impacts for a learned humanoid controller (AA228 final project)"
requires-python = ">=3.10"
dependencies = ["numpy", "absl-py", "ml_collections", "etils"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["foresight*"]
